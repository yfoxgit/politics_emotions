[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotiveness"
version = "0.1.0"
description = "Language analysis project for D200 assessment."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [

    # standard packages
    "fastparquet>=2024.2.0",
    "pandas>=2.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",

    # loading pdfs
    "pymupdf>=1.23.0",

    # language processing
    "nltk>=3.8.0",

    # G&A model
    "gensim>=4.3.0",

    # Claude LLM
    "python-dotenv>=1.0.0",
    "anthropic>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
